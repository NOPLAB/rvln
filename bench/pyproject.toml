[project]
name = "rvln-bench"
version = "0.1.0"
description = "Isaac Sim evaluation for R2R-CE and the RVLN ROS stack"
requires-python = ">=3.12,<3.13"
dependencies = ["usim"]

[tool.uv.sources]
usim = { path = "../external/usim", editable = true }

[project.scripts]
rvln-bench = "bench.cli:main"

[project.entry-points."rvln_bench.plugins"]
isaac_r2r = "isaac_r2r.cli:register"
isaac_rvln = "isaac_rvln.cli:register"

[project.optional-dependencies]
usd = ["usd-core==25.5", "numpy>=1.26,<2"]
isaac = [
  "isaacsim[all,extscache]==6.1.0.0",
  "numpy==2.3.1",
  "pillow>=12.1.1,<13",
  "torch==2.11.0",
  "torchvision==0.26.0",
]
omnivla-edge-inference = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "numpy>=2.3,<3",
  "pillow>=11.3,<13",
  "opencv-python-headless>=4.13,<5",
  "openai-clip==1.0.1",
  "efficientnet-pytorch==0.7.1",
  "ftfy>=6.3,<7",
  "regex>=2026.9",
  "setuptools<81",
]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[tool.uv]
extra-index-url = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
conflicts = [
  [{ extra = "usd" }, { extra = "isaac" }],
  [{ extra = "usd" }, { extra = "omnivla-edge-inference" }],
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench", "src/isaac_r2r", "src/isaac_rvln"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
