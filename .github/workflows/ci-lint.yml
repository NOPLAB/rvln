# rvln_* パッケージを ament linter (flake8 / pep257 / xmllint / lint_cmake)
# でチェックする。C++ ソースが無いため clang-format / uncrustify / cpplint は
# 回さない。copyright はライセンスヘッダを付けない方針のため対象外。
#
# 実行コマンドは `ament_<linter> <パッケージパス...> <arguments>` の形
# (action-ros-lint が組み立てる)。flake8 はリポジトリ共通の .flake8 を、
# pep257 は .pydocstyle と同じ ignore リストを arguments で渡す
# (ament_pep257 は設定ファイルを読まないため。変更時は .pydocstyle /
#  各 test_pep257.py / CMakeLists.txt と同期させること)。
name: ci-lint

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.flake8'
      - 'tools/japanese_source_check.py'
      - 'tools/test_japanese_source_check.py'
      - '.pre-commit-config.yaml'
      - '.pydocstyle'
      - '.github/workflows/ci-lint.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.flake8'
      - 'tools/japanese_source_check.py'
      - 'tools/test_japanese_source_check.py'
      - '.pre-commit-config.yaml'
      - '.pydocstyle'
      - '.github/workflows/ci-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no_japanese_src:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check src text
        run: python3 tools/japanese_source_check.py src
      - name: Test source check
        run: python3 -m unittest discover -s tools -p 'test_japanese_source_check.py'

  ament_lint:
    # ROS2 humble の apt パッケージは Ubuntu 22.04 のみ。ubuntu-latest (24.04) は不可。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - linter: flake8
            arguments: '--config .flake8'
          - linter: pep257
            arguments: '--add-ignore D213 D400 D401 D403 D406 D407 D413 D415'
          - linter: xmllint
            arguments: ''
          - linter: lint_cmake
            arguments: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - uses: ros-tooling/action-ros-lint@v0.1
        with:
          distribution: humble
          linter: ${{ matrix.linter }}
          arguments: ${{ matrix.arguments }}
          package-name: >-
            rvln_bringup
            rvln_core
            rvln_edge
            rvln_msgs
            rvln_proto
            rvln_remote
