# web/ (rvla-web) を GitHub Pages へデプロイする。
#
# 注意:
# - ONNX モデル (~590MB) と CLIP 語彙は git 管理外。ビルド時に GitHub Release
#   `models-v1` のアセットから public/ へ配置する (モデル更新は
#   `gh release upload models-v1 <files> --clobber` して再実行)。release が
#   取得できない場合はダミー軌道モードのままデプロイする。
# - Pages は https 配信のため、Pi への ws:// 接続は mixed content で塞がれる。
#   ブラウザ内推論のデモ用途 (Pi 併用の実運用は localhost 配信、
#   docs/design/web_port_spec.md §4)。
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install (postinstall が ORT ランタイムを public/ort/ へコピー)
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Download ONNX models (release models-v1 -> public/)
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download models-v1 --repo "$GITHUB_REPOSITORY" --pattern '*.onnx' --dir public/models &&
             gh release download models-v1 --repo "$GITHUB_REPOSITORY" --pattern '*.txt.gz' --dir public/clip; then
            ls -lh public/models public/clip
          else
            echo "::warning::models-v1 release を取得できません — ダミー軌道モードでデプロイします"
          fi

      - name: Build (SSG, サブパス /<repo> 配信)
        working-directory: web
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
