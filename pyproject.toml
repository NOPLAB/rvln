[tool.ruff]
required-version = "==0.16.9"
target-version = "py310"
line-length = 99
extend-exclude = [
    # Submodules and verbatim upstream model code.
    "external",
    "src/raspicat_description",
    "src/rvln_core/rvln_core/models/omnivla_edge_model.py",
    # Generated protocol bindings.
    "*_pb2.py",
    "*_pb2_grpc.py",
    # Workspace outputs, downloaded assets and runtime environments.
    "/build",
    "/install",
    "/log",
    "/models",
    "/bench/runs",
    ".uv-cache",
    ".omo",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
